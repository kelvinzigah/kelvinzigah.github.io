<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V CPU FPGA placeholder visual</title>
  <desc id="desc">A stylized FPGA board and processor pipeline diagram with amber signal paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f1800"/>
      <stop offset="1" stop-color="#061327"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <path d="M72 122h816v376H72z" fill="#07152b" stroke="#ffe64d" stroke-width="6"/>
  <path d="M128 178h704v264H128z" fill="#0b2e5c" stroke="#20e7ff" stroke-opacity=".75" stroke-width="4"/>
  <g fill="#061327" stroke="#fff7ad" stroke-width="5">
    <rect x="194" y="232" width="112" height="92"/>
    <rect x="364" y="232" width="112" height="92"/>
    <rect x="534" y="232" width="112" height="92"/>
    <rect x="704" y="232" width="72" height="92"/>
  </g>
  <g stroke="#ffe64d" stroke-width="8" stroke-linecap="round">
    <path d="M306 278h58"/>
    <path d="M476 278h58"/>
    <path d="M646 278h58"/>
    <path d="M250 232V198h430v34"/>
    <path d="M250 324v34h454"/>
  </g>
  <g fill="url(#chip)" stroke="#ffffff" stroke-width="4">
    <path d="M410 76h140l34 34v74H376v-74z"/>
    <rect x="404" y="390" width="152" height="72"/>
  </g>
  <g fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-weight="800" text-anchor="middle">
    <text x="250" y="288" font-size="28">FETCH</text>
    <text x="420" y="288" font-size="28">DECODE</text>
    <text x="590" y="288" font-size="28">EXEC</text>
    <text x="740" y="288" font-size="28">I/O</text>
    <text x="480" y="137" font-size="34">RV32I</text>
    <text x="480" y="440" font-size="28">UART / SPI</text>
  </g>
  <g fill="#20e7ff">
    <circle cx="128" cy="178" r="10"/>
    <circle cx="832" cy="178" r="10"/>
    <circle cx="128" cy="442" r="10"/>
    <circle cx="832" cy="442" r="10"/>
  </g>
</svg>
